  <text x="28" y="368" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#616d75">Strong deterministic rules capture 98.2%. Selective AI captures 96.6% — 1.6 points lower, before counting what the AI cost.</text>
